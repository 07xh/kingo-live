name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        shell: bash
        run: python -m py_compile kingo-live/*.py bench/*.py
      - name: Real loopback HTTP end-to-end
        shell: bash
        working-directory: kingo-live
        run: |
          python selftest.py
          python test_optimizations.py
          python cli_smoke.py
          python har_to_schema.py --self-test
      - name: Offline simulation and P5 matrix
        shell: bash
        working-directory: bench
        run: |
          python academic_latency_sim.py --self-test
          python academic_latency_sim.py --all
          python academic_latency_sim.py --p5-matrix --repeats 5

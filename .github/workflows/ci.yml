name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Windows runners default to cp1252; catalog bodies contain Chinese text.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        shell: bash
        run: python -m py_compile contracts/*.py kingo-live/*.py bench/*.py ncwu/*.py qiangke/run.py qiangke/qk/*.py qiangke/qk/adapters/*.py qiangke/tests/*.py ops/*.py
      - name: Shared read-only offering contract (offline)
        shell: bash
        run: python -m unittest discover -s contracts/tests -q
      - name: Course-plan parser regressions (offline)
        shell: bash
        run: python -m unittest discover -s ncwu/tests -q
      - name: Qiangke offline tests and local mock E2E
        shell: bash
        working-directory: qiangke
        run: |
          python tests/test_net_safety.py
          python tests/test_submission_safety.py
          python tests/test_intent_journal.py
          python tests/test_tls.py
          python tests/test_pwd.py
          python tests/test_xk.py
          python tests/test_readonly_export.py
          python tests/test_guard.py
          python tests/test_auto.py
          python tests/e2e_kingo.py
          python tests/e2e.py
      - name: Real loopback HTTP end-to-end
        shell: bash
        working-directory: kingo-live
        run: |
          python -m unittest test_intent_safety test_request_policy -q
          python selftest.py
          python test_optimizations.py
          python cli_smoke.py
          python har_to_schema.py --self-test
      - name: OPS research regressions (offline and localhost only)
        shell: bash
        working-directory: ops
        run: |
          python test_ops.py
          python test_fingerprint.py
          python test_phase2.py
          python test_phase3.py
          python test_hardening.py -v
      - name: Ops canonical snapshots diagnostics (offline)
        shell: bash
        run: |
          python -m ops.readonly_diagnostics --self-test
          python -m unittest ops.test_readonly_diagnostics -v
      - name: Offline simulation and P5 matrix
        shell: bash
        working-directory: bench
        run: |
          python academic_latency_sim.py --self-test
          python academic_latency_sim.py --all
          python academic_latency_sim.py --p5-matrix --repeats 5

  windows-desktop:
    name: Windows integrated GUI (offline only)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop dependencies
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Desktop dependencies failed" }
      - name: Unit tests and Python GUI smoke
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop unit tests failed" }
          python windows_gui.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows source self-test failed" }
          python -c "from windows_gui import run_packaged_gui_smoke; run_packaged_gui_smoke()"
          if ($LASTEXITCODE -ne 0) { throw "Windows source GUI smoke failed" }
      - name: Build integrated Windows GUI
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KingoAssistant-Windows --add-data "config.example.yaml;." --add-data "demo;demo" --add-data "../../../kingo-live/har_to_schema.py;." --paths "../../.." --collect-submodules contracts --hidden-import contracts.har_core --hidden-import contracts.seat_diff --collect-submodules pystray windows_gui.py
          if ($LASTEXITCODE -ne 0) { throw "Integrated Windows build failed" }
      - name: Verify packaged executable offline
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python tools/verify_windows_build.py "dist/KingoAssistant-Windows.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE verification failed" }
          Get-Content dist/build-verification.json
      - name: Upload integrated desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingoAssistant-integrated-Windows-portable
          path: |
            clients/windows/source/dist/KingoAssistant-Windows.exe
            clients/windows/source/dist/SHA256.txt
            clients/windows/source/dist/build-verification.json
          if-no-files-found: error
          retention-days: 14

